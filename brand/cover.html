<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1000px;height:420px;background:#0f1729;color:#e8ecf4;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.wrap{padding:44px 56px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;background:radial-gradient(900px 500px at 95% 110%,rgba(245,168,0,.18),transparent 60%),radial-gradient(700px 400px at -10% -20%,rgba(46,144,250,.16),transparent 60%)}
.brand{display:flex;align-items:center;gap:18px;font-size:30px;font-weight:700;letter-spacing:-.01em}
.brand img{width:54px;height:54px}
h1{font-size:42px;line-height:1.08;letter-spacing:-.025em;margin:20px 0 0;max-width:22ch}
.rows{margin-top:auto;display:flex;flex-direction:column;gap:8px;font:500 19px ui-monospace,"SF Mono",Menlo,monospace}
.row{display:flex;gap:16px;align-items:center}
.old{color:#8f99ad;text-decoration:line-through;text-decoration-color:#f5a800}
.new{color:#6fd39c}
.arrow{color:#f5a800}
.tag{font:600 16px Inter,system-ui;color:#15213b;background:#f5a800;border-radius:999px;padding:4px 12px}
.foot{position:absolute;right:56px;top:52px;font-size:16px;color:#8f99ad;text-align:right;line-height:1.5}
</style></head><body><div class="wrap">
<div class="brand"><img src="mark.svg">Attrition</div>
<h1>Find the OpenTelemetry names the spec already retired.</h1>
<div class="rows">
<div class="row"><span class="old">db.system</span><span class="arrow">→</span><span class="new">db.system.name</span></div>
<div class="row"><span class="old">net.peer.name</span><span class="arrow">→</span><span class="new">server.address</span><span class="tag">client span</span></div>
<div class="row"><span class="old">http.server.duration</span><span class="arrow">→</span><span class="new">http.server.request.duration</span><span class="tag">ms to s</span></div>
</div>
<div class="foot">1,563 names · 26 spec releases<br>Sanity Context + Knowledge Base</div>
</div></body></html>
